<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Suscripciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            width: 800px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            text-align: left;
        }
        .form-inline {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 15px;
        }
        button {
            padding: 6px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #c82333;
        }
        .message {
            margin-top: 20px;
            color: red;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Historial de Suscripciones</h2>

    <!-- Mostrar mensaje de error o éxito -->
    <div th:if="${error}" class="message" th:text="${error}"></div>

    <div th:if="${mensaje}" class="message" style="color: green;" th:text="${mensaje}"></div>

    <!-- Formulario para filtrar por tipo de suscripción -->
    <form th:action="@{/tipo-suscripcion}" method="post" class="form-inline">
        <label><input type="checkbox" name="tipoSuscripcion" value="basico"> Básico</label>
        <label><input type="checkbox" name="tipoSuscripcion" value="premium"> Premium</label>
        <button type="submit" style="background-color: #007BFF;">Filtrar</button>
    </form>

    <!-- Tabla de clientes -->
    <table th:if="${clientes}">
        <thead>
        <tr>
            <th>DNI</th>
            <th>Tipo de Plan</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.dni}"></td>
            <td th:text="${cliente.tipoSuscripcion}"></td>
            <td>
                <form th:action="@{/eliminar-suscripcion}" method="post" style="display:inline;">
                    <input type="hidden" name="dni" th:value="${cliente.dni}">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>



    <a th:href="@{/suscripcion}" style="display:inline-block; margin-top: 20px;">Volver al inicio</a>
</div>
</body>
</html>
