<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suscripción de Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f9f9f9;
        }

        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 400px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label, input[type="radio"] {
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .message {
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="form-container">

    <!-- Mensaje de error o éxito -->
    <div th:if="${error}" class="message" style="color: red;" th:text="${error}"></div>
    <div th:if="${mensaje}" class="message" style="color: green;" th:text="${mensaje}"></div>

    <h2>Suscribir Cliente a Plan</h2>

    <!-- Formulario para suscripción -->
    <form th:action="@{/suscribir-cliente}" method="post">
        <div class="form-group">
            <label for="dni">DNI del Cliente:</label>
            <input type="text" id="dni" name="dni" required th:value="${dni}">
        </div>

        <div class="form-group">
            <label>Tipo de Plan:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="suscripcion" value="basico" required
                           th:checked="${suscripcionSeleccionada == 'basico'}">
                    Básico ($5000)
                </label>
                <label>
                    <input type="radio" name="suscripcion" value="premium" required
                           th:checked="${suscripcionSeleccionada == 'premium'}">
                    Premium ($10000)
                </label>
            </div>
        </div>

        <div class="form-group">
            <button type="submit">Suscribir</button>
        </div>
    </form>

    <!-- Botón para ver historial de suscripciones -->
    <form th:action="@{/obtener-todos}" method="get">
        <button type="submit">Ver Historial de Suscripciones</button>
    </form>

</div>
</body>
</html>
